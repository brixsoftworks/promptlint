[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "promptlint"
version = "1.0.0"
description = "The developer toolkit for testing, analyzing, optimizing, and versioning AI prompts."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "PromptLint Contributors" },
]
keywords = ["prompt", "lint", "ai", "llm", "developer-tools", "testing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.9",
    "rich>=13.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
]
ai = [
    "litellm>=1.0.0",
]
lsp = [
    "pygls>=1.3.0",
]
mcp = [
    "mcp>=1.0.0",
]
all = [
    "litellm>=1.0.0",
    "pygls>=1.3.0",
    "mcp>=1.0.0",
]

[project.scripts]
promptlint = "promptlint.cli:app"

[project.urls]
Homepage = "https://github.com/brixsoftworks/promptlint"
Repository = "https://github.com/brixsoftworks/promptlint"
Issues = "https://github.com/brixsoftworks/promptlint/issues"
Documentation = "https://github.com/brixsoftworks/promptlint/tree/main/docs"

[tool.hatch.build.targets.wheel]
packages = ["src/promptlint"]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
